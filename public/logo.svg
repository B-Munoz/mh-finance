<svg width="320" height="320" viewBox="0 0 320 320" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="mhGrad" gradientUnits="userSpaceOnUse" x1="0" y1="97" x2="0" y2="213">
      <stop offset="0%" stop-color="#FFD54A"/>
      <stop offset="100%" stop-color="#F2A93C"/>
    </linearGradient>
    <linearGradient id="barGrad" gradientUnits="userSpaceOnUse" x1="26" y1="0" x2="290" y2="0">
      <stop offset="0%" stop-color="#2DD4BF"/>
      <stop offset="100%" stop-color="#3B82F6"/>
    </linearGradient>
  </defs>

  <!-- finance motif: ascending bars + trend line, in a contrasting teal/blue -->
  <g>
    <rect x="26"  y="157" width="24" height="70"  rx="8" fill="url(#barGrad)"/>
    <rect x="74"  y="129" width="24" height="98"  rx="8" fill="url(#barGrad)"/>
    <rect x="122" y="103" width="24" height="124" rx="8" fill="url(#barGrad)"/>
    <rect x="170" y="75"  width="24" height="152" rx="8" fill="url(#barGrad)"/>
    <rect x="218" y="107" width="24" height="120" rx="8" fill="url(#barGrad)"/>
    <rect x="266" y="53"  width="24" height="174" rx="8" fill="url(#barGrad)"/>
    <polyline points="38,149 86,121 134,95 182,67 230,99 278,45"
              fill="none" stroke="#5EEAD4" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" opacity="0.9"/>
    <circle cx="278" cy="45" r="6" fill="#5EEAD4"/>
  </g>

  <!-- MH monogram: semi-transparent so the graph shows through -->
  <g fill="none" stroke="url(#mhGrad)" stroke-width="28" stroke-linecap="round" stroke-linejoin="round" stroke-opacity="0.88">
    <!-- M -->
    <polyline points="27,213 27,97 85,155 143,97 143,213" />
    <!-- H -->
    <path d="M177,97 L177,213 M177,155 L293,155 M293,97 L293,213" />
  </g>

  <!-- divider -->
  <rect x="128" y="233" width="64" height="5" rx="2.5" fill="#FFC93C"/>

  <!-- finance -->
  <text x="160" y="273" text-anchor="middle" font-family="'Poppins', 'Segoe UI Rounded', 'SF Pro Rounded', 'Century Gothic', Verdana, sans-serif" font-size="34" font-weight="500" letter-spacing="6" fill="#B7BCC9">finance</text>
</svg>
